<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" >
        <title>My First Webpage</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            body {
                font-family: arial;
                color: white;
                overflow: hidden;
            }

            video {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover; 
                z-index: -1;
            }

            .name {
                position: absolute;
                top: 30%;
                left: 30%;
                list-style: none;
                font-size: 48px;
    
            }

            .tagline {
                position: absolute;
                top: 40%;
                left: 30%;
                font-size: 18px;
            }

            .menu {
                position: absolute;
                top: 10%;
                right: 10%;
                list-style: none;
                font-size: 20px;
            }

            .menu li {
                margin-bottom: 10px;
            }

            .menu i {
                margin-right: 8px;
            }
        </style>
    </head>
    <body>

        <video autoplay muted loop>
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="name">
            Felipe-Ziyad DeSouza
        </div>

        <data class="tagline">
            Computer Science Student | Aspiring Software Engineer
        </data>

        <ul class="menu">
            <li><i class="fa fa-user"></i> about me</li>
            <li><i class="fa fa-envelope"></i> Resume</li>
            <li><i class="fa fa-briefcase"></i> Projects</li>
            <li><i class="fa fa-gamepad"></i> Hobbies</li>
        </ul>
    </body>
</html>
